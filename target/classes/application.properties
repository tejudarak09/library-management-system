# ================= MySQL Configuration =================
# Local dev defaults: just run MySQL on localhost and it works with no changes.
# On a host (Render etc.), override via environment variables:
#   SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/library_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Noxxy09@}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ================= JPA / Hibernate =================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ================= Server =================
# Hosts like Render inject $PORT — respect it, default to 8080 locally.
server.port=${PORT:8080}
